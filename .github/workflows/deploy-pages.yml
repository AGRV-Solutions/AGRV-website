# Deploy to GitHub Pages and inject secrets into site-config.js (not stored in git).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   WEB3FORMS_ACCESS_KEY  — from web3forms.com
#   GA_MEASUREMENT_ID     — e.g. G-XXXXXXXXXX (Google Analytics)
#
# Pages: Settings → Pages → Source → GitHub Actions

name: Deploy GitHub Pages

on:
  push:
    branches: ['main', 'master']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write site-config.js from secrets
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: node scripts/write-site-config.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
